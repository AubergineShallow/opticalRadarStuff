
; PlatformIO project for the ESP32-CAM optical tracking edge node.
;
; Target: AI-Thinker ESP32-CAM (OV2640) + NEO-6M/M8N/M9N GNSS + MPU-6050/BNO08x
;         IMU + a companion Meshtastic radio (default) OR a direct SX127x LoRa
;         module OR WiFi/UDP.
;
; Build/flash (needs a USB-TTL adapter; hold IO0 low to enter bootloader):
;   pio run -e esp32cam_meshtastic -t upload
;   pio device monitor -b 115200
;
; Pick the radio backend by choosing the environment (each just sets a -D flag).

[platformio]
default_envs = esp32cam_meshtastic

[env]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 240000000L
; The OV2640 frame buffers live in PSRAM; the AI-Thinker board has it and the
; esp32cam board definition enables it. -DBOARD_HAS_PSRAM is the switch the
; camera driver checks.
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    ; GNSS NMEA parsing (works for NEO-6M/M8N/M9N over UART or I2C).
    mikalhart/TinyGPSPlus @ ^1.0.3

[env:esp32cam_meshtastic]
; PRIMARY: hand payloads to a companion Meshtastic node over UART (Serial
; Module). The mesh relays them to the laptop's Meshtastic node.
build_flags =
    ${env.build_flags}
    -DRADIO_BACKEND_MESHTASTIC_SERIAL

[env:esp32cam_lora]
; ALTERNATE: drive an SX127x directly (raw point-to-point / star LoRa). Pairs
; with a raw-LoRa USB bridge on the laptop (server lora.transport = "serial").
build_flags =
    ${env.build_flags}
    -DRADIO_BACKEND_LORA_SX127X
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib @ ^6.4.0

[env:esp32cam_wifi]
; FALLBACK: the existing WiFi/UDP V3 telemetry path (no LoRa at all).
build_flags =
    ${env.build_flags}
    -DRADIO_BACKEND_WIFI_UDP
